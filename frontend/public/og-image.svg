<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1E1E1E"/>

  <!-- Subtle texture lines -->
  <line x1="0" y1="0" x2="1200" y2="630" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="200" y1="0" x2="1200" y2="500" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="400" y1="0" x2="1200" y2="380" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="0" y1="130" x2="1000" y2="630" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="0" y1="260" x2="800" y2="630" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Accent bar -->
  <rect x="80" y="260" width="56" height="3" fill="#7C5C3E"/>

  <!-- NDH wordmark -->
  <text x="80" y="240" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="-2">NDH</text>
  <text x="80" y="240" font-family="Georgia, serif" font-size="72" font-weight="400" fill="#A07A56" letter-spacing="-2" dx="180">Knits</text>

  <!-- Tagline -->
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.55)" letter-spacing="4">A LEGACY WOVEN IN QUALITY</text>

  <!-- Sub line -->
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.35)" letter-spacing="2">HOSIERY MANUFACTURER · LUDHIANA, INDIA · EST. 1957</text>
</svg>
